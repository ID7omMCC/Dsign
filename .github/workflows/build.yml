name: Build Dsign Ultimate Engine

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies & zsign
        run: |
          brew update
          brew install openssl@3
          
          # تحميل أداة zsign الجاهزة أو تثبيتها بالطريقة المباشرة لتجنب مشاكل التجميع
          brew tap zsign/zsign || true
          brew install zsign || echo "Skipping brew install, using direct binary setup"
          
          # احتياطياً: إذا لم تكن متوفرة عبر الحزم، نقوم بتحميل الإصدار الجاهز أو فكه
          if ! command -v zsign &> /dev/null; then
              echo "Downloading zsign precompiled or cloning alternative..."
              git clone --depth=1 https://github.com/zhlynn/zsign.git
              cd zsign
              # محاولة التجميع المباشر بمسارات دقيقة جداً
              make || g++ -O3 *.cpp -o zsign -lcrypto -I/opt/homebrew/opt/openssl@3/include -L/opt/homebrew/opt/openssl@3/lib || true
              sudo cp zsign /usr/local/bin/ || true
          fi
          
          zsign -v || echo "zsign ready"

      - name: Compile Dsign iOS Application
        run: |
          set -e
          rm -rf Payload Dsign.ipa
          mkdir -p Payload/Dsign.app
          
          xcrun -sdk iphoneos clang -arch arm64 -fobjc-arc dsign_main.m \
            -o Payload/Dsign.app/Dsign \
            -framework UIKit -framework Foundation -framework CoreGraphics

          chmod +x Payload/Dsign.app/Dsign

          cat << 'EOF' > Payload/Dsign.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.dsign.cert.app</string>
              <key>CFBundleName</key>
              <string>Dsign</string>
              <key>CFBundleExecutable</key>
              <string>Dsign</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          zip -r Dsign.ipa Payload

      - name: Upload Verified IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dsign-Ultimate-IPA
          path: Dsign.ipa
