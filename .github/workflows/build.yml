name: Build Dsign Ultimate Engine

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew update
          brew install openssl@3

      - name: Clone zsign
        run: |
          rm -rf zsign
          git clone --depth=1 https://github.com/zhlynn/zsign.git

      - name: Compile and Install zsign
        working-directory: ./zsign
        run: |
          c++ *.cpp -o zsign -O3 -std=c++11 \
            -I/opt/homebrew/opt/openssl@3/include \
            -L/opt/homebrew/opt/openssl@3/lib \
            -lcrypto
          sudo cp zsign /usr/local/bin/
          zsign -v

      - name: Compile Dsign iOS Application
        run: |
          set -e
          rm -rf Payload Dsign.ipa
          mkdir -p Payload/Dsign.app
          
          xcrun -sdk iphoneos clang -arch arm64 -fobjc-arc dsign_main.m \
            -o Payload/Dsign.app/Dsign \
            -framework UIKit -framework Foundation -framework CoreGraphics

          chmod +x Payload/Dsign.app/Dsign

          cat << 'EOF' > Payload/Dsign.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.dsign.cert.app</string>
              <key>CFBundleName</key>
              <string>Dsign</string>
              <key>CFBundleExecutable</key>
              <string>Dsign</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          zip -r Dsign.ipa Payload

      - name: Upload Verified IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dsign-Ultimate-IPA
          path: Dsign.ipa
